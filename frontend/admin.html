<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | ElectroFix</title><link rel="stylesheet" href="/css/styles.css"><script defer src="/js/admin.js"></script></head>
<body><header class="header"><a class="brand" href="/"><b>EF</b> ElectroFix</a><nav><a href="/">Volver al sitio</a></nav></header>
<main class="wrap section admin-main"><div class="heading"><div><p class="tagline">ÁREA PRIVADA</p><h1>Panel de administración</h1></div><p class="muted">Acceso exclusivo para personal autorizado.</p></div>
<section id="loginPanel" class="card form admin-login"><h2>Iniciar sesión</h2><form id="loginForm"><label>Correo<input name="email" type="email" required autocomplete="username"></label><label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label><button class="btn" type="submit">Ingresar</button><p id="loginStatus" class="status" role="status"></p></form></section>
<section id="dashboard" hidden><div class="admin-toolbar"><div><h2>Solicitudes recibidas</h2><p id="welcomeText" class="muted"></p></div><button id="logoutBtn" class="btn ghost">Cerrar sesión</button></div><p id="dashboardStatus" class="status" role="status"></p><div class="card table-wrap"><table><thead><tr><th>Código</th><th>Cliente</th><th>Contacto</th><th>Equipo / servicio</th><th>Descripción</th><th>Fecha</th><th>Estado</th></tr></thead><tbody id="requestsBody"></tbody></table></div></section>
</main><footer class="footer"><a class="brand" href="/"><b>EF</b> ElectroFix</a><span>Panel administrativo</span></footer></body></html>
